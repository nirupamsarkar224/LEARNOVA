
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnova | Student Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <div class="auth-container">

    <a href="index.html" class="back-link">← Back to Home</a>

    <div class="auth-box">

      <div class="logo">LEARNOVA<span>.</span></div>

      <h1 id="formTitle">Welcome Back</h1>
      <p id="formSubtitle">Login to continue your learning journey.</p>

      <form id="authForm">

        <div id="nameField" class="hidden">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Your full name">
        </div>

        <label>Email Address</label>
        <input type="email" id="email" required placeholder="Enter email">

        <label>Password</label>
        <input type="password" id="password" required minlength="6" placeholder="Enter password">

        <button type="submit" class="primary-btn auth-submit">
          Login
        </button>

      </form>

      <p class="switch-text">
        <span id="switchLabel">New student?</span>
        <button onclick="switchMode()" id="switchButton">Create Account</button>
      </p>

      <p id="authMessage"></p>

    </div>

  </div>

  <script src="auth.js"></script>

</body>
</html>
